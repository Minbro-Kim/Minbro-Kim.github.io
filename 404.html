<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚧 소장장이 공사 중 🚧</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
        }
        .construction-message {
            text-align: center;
        }
        h1 {
            color: #ff6347;
            font-size: 48px;
            animation: bounce 1s infinite alternate;
        }
        p {
            font-size: 20px;
            color: #333;
        }
         a {
            color: #ff6347;
            text-decoration: none;
            font-size: 18px;
        }
        @keyframes bounce {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-10px);
            }
        }
    </style>
</head>
<body>
    <div class="construction-message">
        
        <h1>🚧 공사 중 🚧</h1>
        
        <p>⚒️대장장이가 페이지를 공사 중이니 돌아가시오!🪚</p>
        <img src="/assets/images/meee.png" alt="공사 중 이미지">
         <p><a href="/">🏠 돌아가기</a></p>
    </div>
</body>
</html>
